<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CV Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    /* ── RESET ── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --sb-w:       400px;
      --r:          7px;
      /* dark UI */
      --ui-bg:      #141210;
      --ui-panel:   #1c1916;
      --ui-border:  #2e2b27;
      --ui-text:    #e4e0da;
      --ui-muted:   #7a756f;
      --ui-faint:   #3a3630;
      --ui-input:   #242018;
      --ui-accent:  #c0622e;
      --ui-accent2: #e07a4a;
      /* CV / paper */
      --cv-paper:   #faf8f5;
      --cv-warm:    #f2ede6;
      --cv-ink:     #111111;
      --cv-ink2:    #505050;
      --cv-ink3:    #909090;
      --cv-line:    #e0dbd4;
      --cv-accent:  #c0622e;
      --cv-accent2: #e07a4a;
      /* fonts */
      --f-disp:     'Cormorant Garamond', Georgia, serif;
      --f-body:     'Outfit', system-ui, sans-serif;
      --f-mono:     'JetBrains Mono', 'Courier New', monospace;
    }

    html, body { height: 100%; overflow: hidden; }
    body { font-family: var(--f-body); background: var(--ui-bg); color: var(--ui-text); display: flex; }

    /* ════════════════════════════════════════════
       SIDEBAR
    ════════════════════════════════════════════ */
    #sidebar {
      width: var(--sb-w); min-width: var(--sb-w);
      background: var(--ui-panel);
      border-right: 1px solid var(--ui-border);
      display: flex; flex-direction: column;
      height: 100vh; position: relative;
    }
    .sb-head {
      padding: 22px 26px 16px;
      border-bottom: 1px solid var(--ui-border);
      flex-shrink: 0;
    }
    .sb-logo { font-family: var(--f-disp); font-size: 22px; font-weight: 700; color: var(--ui-text); }
    .sb-logo em { color: var(--ui-accent2); font-style: normal; }
    .sb-sub { font-family: var(--f-mono); font-size: 9px; letter-spacing: 1.8px; text-transform: uppercase; color: var(--ui-muted); margin-top: 3px; }

    .sb-scroll {
      flex: 1; overflow-y: auto;
      padding: 16px 24px 110px;
      scrollbar-width: thin; scrollbar-color: var(--ui-faint) transparent;
    }
    .sb-scroll::-webkit-scrollbar { width: 4px; }
    .sb-scroll::-webkit-scrollbar-thumb { background: var(--ui-faint); border-radius: 4px; }

    .sec-label {
      font-family: var(--f-mono); font-size: 9px; letter-spacing: 2px;
      text-transform: uppercase; color: var(--ui-muted);
      margin-top: 22px; margin-bottom: 10px;
      padding-bottom: 7px; border-bottom: 1px solid var(--ui-border);
    }
    .sec-label:first-child { margin-top: 0; }

    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .fld { margin-bottom: 10px; }
    .fld label { display: block; font-size: 11px; color: var(--ui-muted); margin-bottom: 4px; }
    .fld input, .fld textarea {
      width: 100%; background: var(--ui-input);
      border: 1px solid var(--ui-faint); border-radius: var(--r);
      padding: 8px 11px; font-family: var(--f-body);
      font-size: 13px; color: var(--ui-text);
      transition: border-color .15s; resize: none; line-height: 1.5;
    }
    .fld input:focus, .fld textarea:focus { outline: none; border-color: var(--ui-accent2); }
    .fld input::placeholder, .fld textarea::placeholder { color: var(--ui-faint); }

    /* photo */
    .photo-box {
      display: flex; align-items: center; gap: 14px;
      background: var(--ui-input); border: 2px dashed var(--ui-faint);
      border-radius: var(--r); padding: 12px 14px;
      cursor: pointer; transition: border-color .15s; margin-bottom: 10px;
    }
    .photo-box:hover { border-color: var(--ui-accent2); }
    .photo-av {
      width: 52px; height: 52px; border-radius: 50%;
      border: 2px solid var(--ui-faint); background: var(--ui-bg);
      overflow: hidden; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 20px;
    }
    .photo-av img { width: 100%; height: 100%; object-fit: cover; display: none; }
    .photo-info .pit { font-size: 12px; color: var(--ui-text); font-weight: 500; }
    .photo-info .pis { font-size: 11px; color: var(--ui-muted); margin-top: 2px; }
    #pRemove {
      margin-left: auto; background: none; border: none;
      color: #c0392b; font-size: 18px; cursor: pointer;
      line-height: 1; padding: 4px 6px; border-radius: 4px;
      transition: background .15s; display: none;
    }
    #pRemove:hover { background: rgba(192,57,43,.15); }
    #pFile { display: none; }

    /* cards */
    .card {
      background: #201d19; border: 1px solid var(--ui-border);
      border-radius: var(--r); padding: 12px 13px; margin-bottom: 8px;
    }
    .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .card-lbl { font-family: var(--f-mono); font-size: 10px; color: var(--ui-accent2); }
    .btn-rm {
      background: none; border: 1px solid var(--ui-border); color: var(--ui-muted);
      padding: 2px 8px; border-radius: 4px; font-size: 11px;
      cursor: pointer; font-family: var(--f-body); transition: all .15s;
    }
    .btn-rm:hover { border-color: #c0392b; color: #c0392b; }
    .btn-add {
      width: 100%; background: var(--ui-input);
      border: 1px dashed var(--ui-faint); color: var(--ui-muted);
      padding: 9px; border-radius: var(--r); font-size: 12px;
      cursor: pointer; font-family: var(--f-body); transition: all .15s; margin-top: 2px;
    }
    .btn-add:hover { border-color: var(--ui-accent2); color: var(--ui-accent2); }

    .sb-foot {
      position: absolute; bottom: 0; left: 0;
      width: 100%; padding: 14px 22px 16px;
      background: var(--ui-panel); border-top: 1px solid var(--ui-border);
    }
    #btnDl {
      width: 100%; background: var(--ui-accent); color: #fff;
      border: none; padding: 13px; border-radius: var(--r);
      font-size: 14px; font-weight: 600; cursor: pointer;
      font-family: var(--f-body); letter-spacing: .2px;
      transition: background .15s, transform .1s;
    }
    #btnDl:hover  { background: #a85228; transform: translateY(-1px); }
    #btnDl:active { transform: translateY(0); }
    #btnDl:disabled { background: #6b3220; cursor: not-allowed; transform: none; }

    /* ════════════════════════════════════════════
       PREVIEW PANEL
    ════════════════════════════════════════════ */
    #preview {
      flex: 1; background: #0e0c0a;
      overflow-y: auto; padding: 44px 36px 60px;
      display: flex; justify-content: center; align-items: flex-start;
    }
    #preview::-webkit-scrollbar { width: 6px; }
    #preview::-webkit-scrollbar-thumb { background: var(--ui-faint); border-radius: 4px; }

    /* ════════════════════════════════════════════
       CV DOCUMENT  (visible + print-clone share .cv-doc styles)
    ════════════════════════════════════════════ */
    .cv-doc {
      background: var(--cv-paper);
      color: var(--cv-ink);
      font-family: var(--f-body);
    }
    #cvDoc {                         /* visible preview */
      width: 100%; max-width: 680px;
      box-shadow: 0 24px 80px rgba(0,0,0,.6);
      border-radius: 2px;
    }

    /* header */
    .cv-hd {
      background: var(--cv-ink);
      padding: 36px 44px;
      display: flex; align-items: center; gap: 24px;
      position: relative; overflow: hidden;
    }
    .cv-hd::before {
      content: ''; position: absolute; right: -50px; top: -50px;
      width: 220px; height: 220px;
      background: var(--cv-accent); opacity: .08; border-radius: 50%;
    }
    .cv-hd::after {
      content: ''; position: absolute; left: 30px; bottom: -70px;
      width: 160px; height: 160px;
      background: var(--cv-accent2); opacity: .05; border-radius: 50%;
    }
    .cv-photo {
      width: 86px; height: 86px; border-radius: 50%;
      border: 3px solid var(--cv-accent2);
      overflow: hidden; flex-shrink: 0;
      background: #252218;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; position: relative; z-index: 1;
    }
    .cv-photo img { width: 100%; height: 100%; object-fit: cover; display: none; }
    .cv-hd-info { flex: 1; position: relative; z-index: 1; }
    .cv-hd-name {
      font-family: var(--f-disp); font-size: 34px; font-weight: 700;
      color: #fff; letter-spacing: -.5px; line-height: 1.1;
    }
    .cv-hd-title {
      font-family: var(--f-mono); font-size: 11px;
      letter-spacing: 2.5px; text-transform: uppercase;
      color: var(--cv-accent2); margin-top: 6px;
    }
    .cv-contacts { display: flex; flex-wrap: wrap; gap: 4px 18px; margin-top: 14px; }
    .cv-contact {
      font-family: var(--f-mono); font-size: 10.5px;
      color: rgba(255,255,255,.5);
      display: flex; align-items: center; gap: 5px;
    }
    .cv-contact::before {
      content: ''; width: 4px; height: 4px;
      background: var(--cv-accent2); border-radius: 50%; flex-shrink: 0;
    }

    /* body */
    .cv-body { padding: 28px 44px 38px; }
    .cv-sec { margin-bottom: 24px; }
    .cv-sec:last-child { margin-bottom: 0; }
    .cv-sec-title {
      font-family: var(--f-mono); font-size: 9px;
      letter-spacing: 2.5px; text-transform: uppercase;
      color: var(--cv-accent); display: flex; align-items: center; gap: 10px;
      margin-bottom: 14px;
    }
    .cv-sec-title::after { content: ''; flex: 1; height: 1px; background: var(--cv-line); }

    .cv-summary { font-size: 13px; line-height: 1.8; color: #3a3a3a; }

    /* experience */
    .cv-exp-item { padding-bottom: 16px; margin-bottom: 16px; border-bottom: 1px solid var(--cv-line); }
    .cv-exp-item:last-child { border-bottom: none; padding-bottom: 0; margin-bottom: 0; }
    .cv-exp-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .cv-exp-ttl { font-family: var(--f-disp); font-size: 16px; font-weight: 700; color: var(--cv-ink); line-height: 1.2; }
    .cv-exp-dur {
      font-family: var(--f-mono); font-size: 10px; color: var(--cv-ink2);
      white-space: nowrap; background: var(--cv-warm);
      padding: 2px 8px; border-radius: 3px; flex-shrink: 0; margin-top: 3px;
    }
    .cv-exp-co { font-size: 12px; color: var(--cv-accent); font-weight: 500; margin: 4px 0 6px; }
    .cv-exp-desc { font-size: 12.5px; line-height: 1.7; color: var(--cv-ink2); }

    /* education */
    .cv-edu-item { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--cv-line); }
    .cv-edu-item:first-child { padding-top: 0; }
    .cv-edu-item:last-child  { border-bottom: none; padding-bottom: 0; }
    .cv-edu-deg { font-size: 13px; font-weight: 600; color: var(--cv-ink); line-height: 1.3; }
    .cv-edu-sch { font-size: 12px; color: var(--cv-ink2); margin-top: 2px; }
    .cv-edu-yr  { font-family: var(--f-mono); font-size: 10px; color: var(--cv-ink3); white-space: nowrap; flex-shrink: 0; margin-top: 3px; }

    /* skills */
    .cv-skills { display: flex; flex-wrap: wrap; gap: 8px; }
    .cv-skill {
      font-size: 12px; color: var(--cv-ink);
      background: var(--cv-warm); border: 1px solid var(--cv-line);
      padding: 4px 14px; border-radius: 20px;
      display: flex; align-items: center; gap: 6px;
    }
    .cv-skill::before { content: ''; width: 5px; height: 5px; background: var(--cv-accent); border-radius: 50%; flex-shrink: 0; }

    /* ════════════════════════════════════════════
       OFF-SCREEN RENDER CONTAINER (for PDF)
    ════════════════════════════════════════════ */
    #cvRenderWrap {
      position: fixed;
      top: 0; left: -9999px;
      width: 794px;         /* A4 @ 96 dpi */
      background: transparent;
      pointer-events: none;
      z-index: -1;
      visibility: hidden;
    }
    #cvRender {
      width: 794px;
    }

    /* toast */
    #toast {
      position: fixed; bottom: 28px; left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: #222; color: #eee;
      padding: 10px 22px; border-radius: 30px;
      font-size: 13px; font-family: var(--f-body);
      opacity: 0; transition: opacity .3s, transform .3s;
      pointer-events: none; z-index: 9999; white-space: nowrap;
    }
    #toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<!-- ═══════════════ SIDEBAR ═══════════════ -->
<aside id="sidebar">
  <div class="sb-head">
    <div class="sb-logo">CV<em>.</em>Builder</div>
    <div class="sb-sub">Professional Resume Creator</div>
  </div>

  <div class="sb-scroll">
    <!-- Photo -->
    <div class="sec-label">Profile Photo</div>
    <div class="photo-box" id="pBox" onclick="document.getElementById('pFile').click()">
      <div class="photo-av" id="pAv"><span id="pEmoji">👤</span><img id="pThumb" alt="photo" /></div>
      <div class="photo-info"><div class="pit">Upload Photo</div><div class="pis">JPG / PNG · shown in header</div></div>
      <button id="pRemove" onclick="removePhoto(event)">✕</button>
    </div>
    <input type="file" id="pFile" accept="image/png,image/jpeg,image/webp" />

    <!-- Personal -->
    <div class="sec-label">Personal Information</div>
    <div class="fld"><label>Full Name</label><input id="fName" type="text" placeholder="e.g. John Smith" /></div>
    <div class="fld"><label>Job Title</label><input id="fTitle" type="text" placeholder="e.g. Software Engineer" /></div>
    <div class="row2">
      <div class="fld"><label>Email</label><input id="fEmail" type="email" placeholder="you@email.com" /></div>
      <div class="fld"><label>Phone</label><input id="fPhone" type="tel" placeholder="+1 555 0100" /></div>
    </div>
    <div class="row2">
      <div class="fld"><label>Location</label><input id="fLoc" type="text" placeholder="City, Country" /></div>
      <div class="fld"><label>LinkedIn / Website</label><input id="fWeb" type="text" placeholder="linkedin.com/in/you" /></div>
    </div>

    <!-- Summary -->
    <div class="sec-label">Professional Summary</div>
    <div class="fld"><textarea id="fSummary" rows="4" placeholder="Write a short professional summary…"></textarea></div>

    <!-- Experience -->
    <div class="sec-label">Work Experience</div>
    <div id="expList"></div>
    <button class="btn-add" onclick="addExp()">＋ Add Experience</button>

    <!-- Education -->
    <div class="sec-label">Education</div>
    <div id="eduList"></div>
    <button class="btn-add" onclick="addEdu()">＋ Add Education</button>

    <!-- Skills -->
    <div class="sec-label">Skills</div>
    <div id="skillList"></div>
    <button class="btn-add" onclick="addSkill()">＋ Add Skill</button>
  </div>

  <div class="sb-foot">
    <button id="btnDl" onclick="downloadPDF()">⬇ &nbsp;Download PDF</button>
  </div>
</aside>

<!-- ═══════════════ PREVIEW ═══════════════ -->
<main id="preview">
  <div id="cvDoc" class="cv-doc">
    <!-- header -->
    <div class="cv-hd" id="cvHd">
      <div class="cv-photo" id="cvPhoto"><span id="cvPEmoji">👤</span><img id="cvPImg" alt="photo" /></div>
      <div class="cv-hd-info">
        <div class="cv-hd-name"  id="cvName">Your Name</div>
        <div class="cv-hd-title" id="cvJobTitle">Your Job Title</div>
        <div class="cv-contacts" id="cvContacts"></div>
      </div>
    </div>
    <!-- body -->
    <div class="cv-body">
      <div class="cv-sec" id="secSummary" style="display:none">
        <div class="cv-sec-title">Profile</div>
        <p class="cv-summary" id="cvSummaryTxt"></p>
      </div>
      <div class="cv-sec" id="secExp" style="display:none">
        <div class="cv-sec-title">Experience</div>
        <div id="cvExpItems"></div>
      </div>
      <div class="cv-sec" id="secEdu" style="display:none">
        <div class="cv-sec-title">Education</div>
        <div id="cvEduItems"></div>
      </div>
      <div class="cv-sec" id="secSkills" style="display:none">
        <div class="cv-sec-title">Skills</div>
        <div class="cv-skills" id="cvSkillItems"></div>
      </div>
    </div>
  </div>
</main>

<!-- Off-screen render target for PDF capture -->
<div id="cvRenderWrap"><div id="cvRender" class="cv-doc"></div></div>

<div id="toast"></div>

<!-- ═══════════════ SCRIPT ═══════════════ -->
<script>
(function(){
  'use strict';

  /* ── counters ── */
  let eIdx=0, dIdx=0, sIdx=0;
  let photoSrc = null;

  /* ══════════════ PHOTO ══════════════ */
  document.getElementById('pFile').addEventListener('change', function(){
    const file = this.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e){
      photoSrc = e.target.result;
      // sidebar thumb
      document.getElementById('pEmoji').style.display='none';
      const t = document.getElementById('pThumb'); t.src=photoSrc; t.style.display='block';
      document.getElementById('pRemove').style.display='block';
      // cv preview
      document.getElementById('cvPEmoji').style.display='none';
      const ci = document.getElementById('cvPImg'); ci.src=photoSrc; ci.style.display='block';
    };
    reader.readAsDataURL(file);
  });

  window.removePhoto = function(e){
    e.stopPropagation();
    photoSrc = null;
    document.getElementById('pEmoji').style.display='';
    const t=document.getElementById('pThumb'); t.src=''; t.style.display='none';
    document.getElementById('pRemove').style.display='none';
    document.getElementById('cvPEmoji').style.display='';
    const ci=document.getElementById('cvPImg'); ci.src=''; ci.style.display='none';
    document.getElementById('pFile').value='';
  };

  /* ══════════════ ENTRIES ══════════════ */
  window.addExp = function(){
    eIdx++;
    const i=eIdx;
    document.getElementById('expList').insertAdjacentHTML('beforeend',`
      <div class="card" data-exp="${i}">
        <div class="card-top">
          <span class="card-lbl">EXPERIENCE</span>
          <button class="btn-rm" onclick="delCard('exp','${i}')">Remove</button>
        </div>
        <div class="row2">
          <div class="fld"><label>Job Title</label><input type="text" class="ex-t" placeholder="Software Developer"/></div>
          <div class="fld"><label>Company</label><input type="text" class="ex-c" placeholder="Company Name"/></div>
        </div>
        <div class="fld"><label>Duration</label><input type="text" class="ex-d" placeholder="Jan 2022 – Present"/></div>
        <div class="fld"><label>Description</label><textarea class="ex-desc" rows="3" placeholder="Key responsibilities and achievements…"></textarea></div>
      </div>`);
    rebind(); render();
  };

  window.addEdu = function(){
    dIdx++;
    const i=dIdx;
    document.getElementById('eduList').insertAdjacentHTML('beforeend',`
      <div class="card" data-edu="${i}">
        <div class="card-top">
          <span class="card-lbl">EDUCATION</span>
          <button class="btn-rm" onclick="delCard('edu','${i}')">Remove</button>
        </div>
        <div class="row2">
          <div class="fld"><label>Degree / Qualification</label><input type="text" class="ed-d" placeholder="B.Sc. Computer Science"/></div>
          <div class="fld"><label>Year</label><input type="text" class="ed-y" placeholder="2016 – 2020"/></div>
        </div>
        <div class="fld"><label>Institution</label><input type="text" class="ed-s" placeholder="University Name"/></div>
      </div>`);
    rebind(); render();
  };

  window.addSkill = function(){
    sIdx++;
    const i=sIdx;
    document.getElementById('skillList').insertAdjacentHTML('beforeend',`
      <div class="card" data-skill="${i}" style="padding:8px 12px;">
        <div style="display:flex;align-items:center;gap:8px;">
          <input type="text" class="sk-n" placeholder="e.g. JavaScript, Figma, Python…" style="flex:1"/>
          <button class="btn-rm" onclick="delCard('skill','${i}')">✕</button>
        </div>
      </div>`);
    rebind(); render();
  };

  window.delCard = function(type, id){
    const el=document.querySelector(`[data-${type}="${id}"]`);
    if(el) el.remove();
    render();
  };

  /* ══════════════ BIND ══════════════ */
  function rebind(){
    document.querySelectorAll('#sidebar input,#sidebar textarea').forEach(el=>{
      el.removeEventListener('input', render);
      el.addEventListener('input', render);
    });
  }

  /* ══════════════ HELPERS ══════════════ */
  function x(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function v(id){ const el=document.getElementById(id); return el ? el.value.trim() : ''; }

  /* ══════════════ BUILD CV HTML ══════════════ */
  function buildHTML(){
    const name    = v('fName')    || 'Your Name';
    const title   = v('fTitle')   || 'Your Job Title';
    const email   = v('fEmail');
    const phone   = v('fPhone');
    const loc     = v('fLoc');
    const web     = v('fWeb');
    const summary = v('fSummary');

    /* contacts */
    const contacts = [email,phone,loc,web].filter(Boolean)
      .map(c=>`<span class="cv-contact">${x(c)}</span>`).join('');

    /* photo */
    const photoHTML = photoSrc
      ? `<img src="${photoSrc}" alt="photo" style="width:100%;height:100%;object-fit:cover;display:block;"/>`
      : `<span style="font-size:28px;color:#555">👤</span>`;

    /* experience */
    let expH='';
    document.querySelectorAll('[data-exp]').forEach(card=>{
      const t    = card.querySelector('.ex-t').value.trim();
      const co   = card.querySelector('.ex-c').value.trim();
      const dur  = card.querySelector('.ex-d').value.trim();
      const desc = card.querySelector('.ex-desc').value.trim();
      if(!t && !co) return;
      expH += `<div class="cv-exp-item">
        <div class="cv-exp-row">
          <div class="cv-exp-ttl">${x(t||'—')}</div>
          ${dur?`<div class="cv-exp-dur">${x(dur)}</div>`:''}
        </div>
        ${co  ?`<div class="cv-exp-co">${x(co)}</div>`:''}
        ${desc?`<div class="cv-exp-desc">${x(desc).replace(/\n/g,'<br>')}</div>`:''}
      </div>`;
    });

    /* education */
    let eduH='';
    document.querySelectorAll('[data-edu]').forEach(card=>{
      const deg  = card.querySelector('.ed-d').value.trim();
      const sch  = card.querySelector('.ed-s').value.trim();
      const yr   = card.querySelector('.ed-y').value.trim();
      if(!deg && !sch) return;
      eduH += `<div class="cv-edu-item">
        <div><div class="cv-edu-deg">${x(deg||'—')}</div>${sch?`<div class="cv-edu-sch">${x(sch)}</div>`:''}</div>
        ${yr?`<div class="cv-edu-yr">${x(yr)}</div>`:''}
      </div>`;
    });

    /* skills */
    let skH='';
    document.querySelectorAll('[data-skill] .sk-n').forEach(inp=>{
      const s=inp.value.trim();
      if(s) skH+=`<div class="cv-skill">${x(s)}</div>`;
    });

    return { name, title, contacts, photoHTML, summary, expH, eduH, skH };
  }

  /* ══════════════ RENDER (live preview) ══════════════ */
  function render(){
    const { name, title, contacts, photoHTML, summary, expH, eduH, skH } = buildHTML();

    document.getElementById('cvName').textContent     = name;
    document.getElementById('cvJobTitle').textContent = title;
    document.getElementById('cvContacts').innerHTML   = contacts;

    /* photo in preview */
    const pi = document.getElementById('cvPImg');
    const pe = document.getElementById('cvPEmoji');
    if(photoSrc){ pe.style.display='none'; pi.src=photoSrc; pi.style.display='block'; }
    else { pe.style.display=''; pi.style.display='none'; }

    /* summary */
    const ss=document.getElementById('secSummary');
    if(summary){ ss.style.display=''; document.getElementById('cvSummaryTxt').textContent=summary; }
    else ss.style.display='none';

    /* exp */
    const se=document.getElementById('secExp');
    if(expH){ se.style.display=''; document.getElementById('cvExpItems').innerHTML=expH; }
    else se.style.display='none';

    /* edu */
    const sd=document.getElementById('secEdu');
    if(eduH){ sd.style.display=''; document.getElementById('cvEduItems').innerHTML=eduH; }
    else sd.style.display='none';

    /* skills */
    const sk=document.getElementById('secSkills');
    if(skH){ sk.style.display=''; document.getElementById('cvSkillItems').innerHTML=skH; }
    else sk.style.display='none';
  }

  /* ══════════════ PDF DOWNLOAD ══════════════ */
  window.downloadPDF = async function(){
    const btn = document.getElementById('btnDl');
    btn.disabled = true;
    btn.innerHTML = '⏳ &nbsp;Generating…';
    showToast('Preparing your CV…');

    try {
      const { name, title, contacts, photoHTML, summary, expH, eduH, skH } = buildHTML();

      /* ── Build inner HTML for the off-screen clone ── */
      const summaryBlock = summary ? `
        <div class="cv-sec">
          <div class="cv-sec-title">Profile</div>
          <p class="cv-summary">${x(summary)}</p>
        </div>` : '';

      const expBlock = expH ? `
        <div class="cv-sec">
          <div class="cv-sec-title">Experience</div>
          ${expH}
        </div>` : '';

      const eduBlock = eduH ? `
        <div class="cv-sec">
          <div class="cv-sec-title">Education</div>
          ${eduH}
        </div>` : '';

      const skBlock = skH ? `
        <div class="cv-sec">
          <div class="cv-sec-title">Skills</div>
          <div class="cv-skills">${skH}</div>
        </div>` : '';

      const cloneHTML = `
        <div class="cv-hd">
          <div class="cv-photo" style="width:86px;height:86px;border-radius:50%;border:3px solid #e07a4a;overflow:hidden;flex-shrink:0;background:#252218;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;">
            ${photoHTML}
          </div>
          <div class="cv-hd-info" style="flex:1;position:relative;z-index:1;">
            <div class="cv-hd-name">${x(name)}</div>
            <div class="cv-hd-title">${x(title)}</div>
            <div class="cv-contacts">${contacts}</div>
          </div>
        </div>
        <div class="cv-body">
          ${summaryBlock}
          ${expBlock}
          ${eduBlock}
          ${skBlock}
        </div>`;

      /* ── Inject into off-screen render div ── */
      const wrap   = document.getElementById('cvRenderWrap');
      const render = document.getElementById('cvRender');
      render.innerHTML = cloneHTML;
      wrap.style.visibility = 'hidden';

      /* Wait two frames for layout + fonts */
      await new Promise(r => requestAnimationFrame(()=>requestAnimationFrame(r)));
      await new Promise(r => setTimeout(r, 400));

      /* ── Capture ── */
      const canvas = await html2canvas(render, {
        scale: 2.5,
        useCORS: true,
        allowTaint: true,
        backgroundColor: '#faf8f5',
        logging: false,
        width:  794,
        height: render.scrollHeight,
        windowWidth:  794,
        windowHeight: render.scrollHeight,
        scrollX: 0,
        scrollY: 0,
        x: 0,
        y: 0,
      });

      /* ── Clean up ── */
      render.innerHTML = '';

      /* ── Build PDF ── */
      const { jsPDF } = window.jspdf;
      const PW = 595.28;   /* A4 width  pt */
      const PH = 841.89;   /* A4 height pt */

      /* How many pt tall is the full canvas? */
      const fullH = (canvas.height / canvas.width) * PW;

      const pdf = new jsPDF({ orientation:'portrait', unit:'pt', format:'a4', compress:true });

      if (fullH <= PH) {
        /* Fits on one page */
        pdf.addImage(canvas.toDataURL('image/jpeg',0.95), 'JPEG', 0, 0, PW, fullH);
      } else {
        /* Slice into A4 pages */
        const pxPerPt  = canvas.width / PW;   /* canvas pixels per PDF point */
        const slicePx  = Math.floor(PH * pxPerPt);
        let yPx = 0;

        while (yPx < canvas.height) {
          const chunkPx = Math.min(slicePx, canvas.height - yPx);
          const slice   = document.createElement('canvas');
          slice.width   = canvas.width;
          slice.height  = chunkPx;
          slice.getContext('2d').drawImage(
            canvas,
            0, yPx, canvas.width, chunkPx,
            0, 0,   canvas.width, chunkPx
          );
          const chunkPtH = (chunkPx / canvas.width) * PW;
          if (yPx > 0) pdf.addPage();
          pdf.addImage(slice.toDataURL('image/jpeg',0.95), 'JPEG', 0, 0, PW, chunkPtH);
          yPx += chunkPx;
        }
      }

      const fname = (v('fName')||'CV').replace(/\s+/g,'_') + '_CV.pdf';
      pdf.save(fname);
      showToast('✓ PDF downloaded!');

    } catch(err){
      console.error('PDF error:', err);
      showToast('Error — please try again.');
    } finally {
      btn.disabled = false;
      btn.innerHTML = '⬇ &nbsp;Download PDF';
    }
  };

  /* ══════════════ TOAST ══════════════ */
  function showToast(msg){
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('on');
    clearTimeout(el._t);
    el._t = setTimeout(()=>el.classList.remove('on'), 2800);
  }

  /* ══════════════ INIT ══════════════ */
  rebind();
  render();

})();
</script>
</body>
